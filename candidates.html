<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>튀르크 후보</title>
<style>
:root { --bg: #e8ebe5; --ink: #16191b; --line: #c6ccc3; --surface: #f7f8f4; --muted: #5a625d; --portrait-bg: #dfe3d9; --accent: #2346c8; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111413; --ink: #e6eae5; --line: #2d3430; --surface: #1c211f; --muted: #8f9890; --portrait-bg: #2a312d; --accent: #7d9bff; color-scheme: dark; }
}
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.lead { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 17px; margin: 0 0 4px; }
.card h2 small { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 6px; }
.card p { margin: 0 0 12px; font-size: 14px; color: var(--muted); line-height: 1.5; }
.moods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.portrait { width: 100%; max-width: 110px; aspect-ratio: 1; margin: 0 auto 4px; border-radius: 50%; background: var(--portrait-bg); box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.portrait svg { display: block; width: 100%; height: 100%; }
.portrait [class^="m-"] { display: none; }
.portrait[data-mood="smug"] .m-smug, .portrait[data-mood="gloat"] .m-gloat,
.portrait[data-mood="angry"] .m-angry, .portrait[data-mood="shock"] .m-shock { display: inline; }
a { color: var(--accent); font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>튀르크 후보</h1>
  <p class="lead">하나를 고르면 게임에는 그 튀르크만 나온다. "한 판 해 보기"로 미리 둬 볼 수 있다.</p>
  <div id="list"></div>
</main>
<script src="characters.js"></script>
<script>
"use strict";
const MOODS = [["smug", "평소"], ["gloat", "신남"], ["angry", "삐짐"], ["shock", "당황"]];
const list = document.getElementById("list");
CHARS.forEach((c, i) => {
  // each card needs its own gradient ids, or the second copy of an svg points at the first one's
  const svg = (k) => portraitSvg(c).replace(/id="([\w-]+)"/g, `id="$1-${k}"`).replace(/url\(#([\w-]+)\)/g, `url(#$1-${k})`);
  const el = document.createElement("section");
  el.className = "card";
  el.innerHTML = `<h2>${i + 1}. ${c.name}<small>${c.id}</small></h2><p>${c.about}</p>
    <div class="moods">${MOODS.map(([k, label]) => `<figure><div class="portrait" data-mood="${k}">${svg(k)}</div>${label}</figure>`).join("")}</div>
    <p style="margin:12px 0 0"><a href="index.html?turk=${c.id}">한 판 해 보기</a></p>`;
  list.appendChild(el);
});
</script>
</body>
</html>
