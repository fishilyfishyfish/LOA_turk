<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOA 튀르크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<style>
/* A sketchbook page: pen lines on paper, like Turk itself.
   Layout: the status line, Turk peeking over the board with its bubble, the board, and the pickers (or one button) */
:root {
  --paper: #f7f6f1;
  --sheet: #fdfdfb;
  --ink: #1b1b1b;
  --muted: #6b6a64;
  --pen: #d8452f;                       /* red pen: selection, moves, captures */
  --marker: rgba(255, 214, 0, .45);     /* highlighter: the last move */
  --hand: 255px 15px 225px 15px / 15px 225px 15px 255px; /* a wobbly hand-drawn box */
  --font: "Gaegu", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 18px; }
.stage { --size: max(260px, min(92vw, calc(100vh - 360px), 560px)); min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
.stage.playing { --size: max(260px, min(92vw, calc(100vh - 330px), 620px)); }

/* Turk: a dome peeking over the board's top edge, wandering left and right; the bubble follows it.
   Its body runs on below the edge, hidden behind the board, so nothing shows underneath when it waddles. */
/* --x is Turk's position along the edge. The dome, the bubble and the bubble's tail are all placed from it,
   so they move as one; --w is the perch width and --bw the bubble width, both set by place(). */
@property --x { syntax: "<length>"; inherits: true; initial-value: 0px; }
.perch { position: relative; width: var(--size); max-width: 100%; height: 142px; margin-bottom: -12px; --x: 0px; --w: 300px; --bw: 200px; }
.portrait { position: absolute; bottom: -36px; left: var(--x); width: 74px; height: 104px; margin-left: -37px; z-index: 0; }
.portrait svg { display: block; width: 100%; height: 100%; overflow: visible; transform-origin: 50% 100%; }
.portrait .face { transition: transform .3s; }
.portrait[data-dir="l"] .face { transform: translateX(-3px); }
.portrait[data-dir="r"] .face { transform: translateX(3px); }
.bubble { --l: clamp(0px, calc(var(--x) - var(--bw) / 2), calc(var(--w) - var(--bw))); position: absolute; left: var(--l); bottom: 78px; margin: 0; width: max-content; max-width: min(300px, 100%); background: var(--sheet); border: 2.4px solid var(--ink); border-radius: var(--hand); padding: 8px 14px; font-size: 19px; line-height: 1.3; transform-origin: calc(var(--x) - var(--l)) bottom; }
.bubble::before { content: ""; position: absolute; left: clamp(20px, calc(var(--x) - var(--l)), calc(var(--bw) - 20px)); bottom: -10px; width: 17px; height: 17px; margin-left: -8px; background: var(--sheet); border-right: 2.4px solid var(--ink); border-bottom: 2.4px solid var(--ink); transform: rotate(45deg); }
@media (prefers-reduced-motion: no-preference) {
  .perch { transition: --x 1.8s ease-in-out; }
  .portrait.walk svg { animation: waddle .45s ease-in-out infinite; }
  .portrait.thinking svg { animation: bob 1.2s ease-in-out infinite; }
  .bubble.pop { animation: pop .25s ease-out; }
}
@keyframes waddle { 25% { transform: rotate(-3deg) translateY(-3px); } 75% { transform: rotate(3deg) translateY(-3px); } }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes pop { from { transform: scale(.94); opacity: .4; } }
.bubble.stale { opacity: .55; }

/* board: plain paper squares, hatched dark squares, pen grid drawn on top (see drawGrid) */
.board { position: relative; z-index: 1; width: var(--size); height: var(--size); display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); background: var(--sheet); }
.grid { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 3; }
.sq { position: relative; border: 0; padding: 0; margin: 0; background: var(--sheet); cursor: pointer; display: grid; place-items: center; }
.sq.dk { background: repeating-linear-gradient(-45deg, transparent 0 7px, rgba(27, 27, 27, .13) 7px 8.5px), var(--sheet); }
.sq:focus-visible { outline: 3px dashed var(--pen); outline-offset: -5px; z-index: 2; }
.sq.last::after { content: ""; position: absolute; inset: 14% 6%; background: var(--marker); border-radius: 40% 10% 45% 12%; transform: rotate(-4deg); pointer-events: none; }
.piece { width: 72%; height: 72%; border-radius: 48% 52% 46% 54% / 53% 47% 55% 45%; pointer-events: none; position: relative; z-index: 1; transition: opacity .3s; }
.piece.b { background: var(--ink); box-shadow: inset -4px -5px 0 -2px rgba(255, 255, 255, .12); }
.piece.w { background: var(--sheet); border: 2.6px solid var(--ink); }
.sq.sel .piece { outline: 2.6px solid var(--pen); outline-offset: 3px; }
.sq.won .piece { outline: 3px solid var(--pen); outline-offset: 3px; }
.board.drawn .piece { opacity: .4; }
.dot { width: 22%; height: 22%; border-radius: 45% 55% 50% 50%; background: var(--pen); pointer-events: none; }
.ring { position: absolute; inset: 6%; border-radius: 52% 48% 50% 50% / 46% 54% 46% 54%; border: 2.6px dashed var(--pen); pointer-events: none; z-index: 2; }
@media (prefers-reduced-motion: no-preference) { .piece.moving { transition: transform .22s cubic-bezier(.2, .7, .2, 1); } }

.bar { width: var(--size); max-width: 100%; min-height: 26px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.status { font-size: 21px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { width: 14px; height: 14px; border-radius: 48% 52% 46% 54%; display: inline-block; }
.chip.b { background: var(--ink); }
.chip.w { background: var(--sheet); border: 2px solid var(--ink); }

/* setup */
.setup { display: flex; flex-direction: column; align-items: center; gap: 10px; width: var(--size); max-width: 100%; }
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; min-height: 48px; }
.btn { font: inherit; font-size: 21px; font-weight: 700; border: 2.6px solid var(--ink); border-radius: var(--hand); padding: 8px 22px; background: var(--sheet); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 3px 4px 0 var(--ink); transition: transform .1s, box-shadow .1s; }
.btn:hover { transform: translate(-1px, -1px) rotate(-1deg); box-shadow: 4px 5px 0 var(--ink); }
.btn:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn:focus-visible { outline: 2.6px dashed var(--pen); outline-offset: 5px; }
@media (max-width: 420px) {
  .bubble { font-size: 18px; }
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="bar">
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <section class="perch" id="perch" aria-label="튀르크">
    <p class="bubble" id="bubble" aria-live="polite"></p>
    <div class="portrait" id="portrait"></div>
  </section>
  <div class="board" id="board" role="grid" aria-label="LOA 판"></div>
  <div class="controls">
    <div class="setup" id="pick">
      <div class="controls">
        <button type="button" class="btn" id="pick-1"><span class="chip b"></span>흑 · 선공</button>
        <button type="button" class="btn" id="pick-2"><span class="chip w"></span>백 · 후공</button>
      </div>
    </div>
    <button type="button" class="btn" id="btn-new" hidden>새 게임</button>
  </div>
</main>

<script src="engine.js"></script>
<script src="characters.js"></script>
<script>
"use strict";
const THINK_MS = 5000, PONDER_MS = 700;
// Turk always plays at full strength: 5 seconds a move, no deliberate mistakes, and it thinks on my time too.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const char = TURK;
let human = 1, started = false; // the game starts once a side is picked
const R = LoaEngine({ ttBits: 8 });
const PASS = R.PASS;
const sqName = (s) => "abcdefgh"[s & 7] + (8 - (s >> 3));
const sideName = (p) => (p === 1 ? "흑" : "백");

let moves = [], state = null, sel = -1, gameId = 0;

function replay() {
  R.setStart();
  const counts = new Map(), key = () => R.hash.join(",");
  counts.set(key(), 1);
  let over = false, winner = 0, passes = 0;
  for (const m of moves) {
    const side = R.stm;
    R.play(m);
    if (m === PASS) { if (++passes >= 2) { over = true; break; } }
    else {
      passes = 0;
      const r = R.resultAfter(side, (m & 4096) !== 0);
      if (r === 1) { over = true; winner = side; break; }
      if (r === -1) { over = true; winner = 3 - side; break; }
      if (r === 2) { over = true; break; }
    }
    const k = key(), c = (counts.get(k) || 0) + 1; counts.set(k, c);
    if (c >= 3) { over = true; break; }
  }
  const b = Array.from(R.board);
  const won = [];
  if (winner) for (let s = 0; s < 64; s++) if (b[s] === winner) won.push(s);
  return { b, stm: R.stm, over, winner, won, legal: over ? [] : R.legalMoves(), last: moves.length ? moves[moves.length - 1] : -1 };
}

/* ---------------- trash talk (logic as in loa-turk before 75777c8) ---------------- */
const portraitEl = document.getElementById("portrait"), bubbleEl = document.getElementById("bubble");
const WIN = R.WIN, MATE = R.MATE_BOUND;
let recent = [], slowTimer = 0, chatTimer = 0, winTimer = 0, prevP = null, mateSaid = false, leadSaid = false, doomSaid = false;
let humanNearSaid = false, engineNearSaid = false, longSaid = false, turnStart = 0;
let games = 0, turkWins = 0, humanWins = 0, streak = 0; // this visit only
function say(key, vars) {
  const all = TALK[key];
  const fresh = all.filter((x) => !recent.includes(x)); // don't repeat anything said in the last few lines
  const pool = fresh.length ? fresh : all;
  const line = pool[Math.floor(Math.random() * pool.length)];
  recent = [line].concat(recent).slice(0, 4);
  bubbleEl.textContent = line.replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] !== undefined ? vars[k] : ""));
  bubbleEl.classList.remove("pop"); void bubbleEl.offsetWidth; bubbleEl.classList.add("pop");
  place(blobX);
}
// Turk wanders along the top edge of the board; it stands still while thinking
const perchEl = document.getElementById("perch");
let blobX = 0.2, wanderTimer = 0, walkTimer = 0;
function place(x) {
  blobX = x;
  const W = perchEl.clientWidth;
  perchEl.style.setProperty("--w", W + "px");
  perchEl.style.setProperty("--bw", bubbleEl.offsetWidth + "px");
  perchEl.style.setProperty("--x", Math.max(42, Math.min(W - 42, x * W)) + "px"); // never past the board's corners
}
function wander() {
  if (!portraitEl.classList.contains("thinking") && Math.random() < 0.8) {
    const nx = 0.1 + Math.random() * 0.8;
    if (Math.abs(nx - blobX) > 0.08 && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      portraitEl.dataset.dir = nx < blobX ? "l" : "r";
      portraitEl.classList.add("walk");
      clearTimeout(walkTimer);
      walkTimer = setTimeout(() => portraitEl.classList.remove("walk"), 1800);
      place(nx);
    }
  }
  wanderTimer = setTimeout(wander, 2500 + Math.random() * 4000);
}
addEventListener("resize", () => place(blobX));
const man = (n) => (n >= 10000 ? Math.round(n / 10000) + "만" : String(n));
function chat() {
  let r = Math.random() * CHAT.reduce((a, k) => a + TALK[k].length, 0);
  for (const k of CHAT) { r -= TALK[k].length; if (r < 0) { say(k); return; } }
  say(CHAT[0]);
}
function endTalk() {
  clearTimeout(slowTimer); clearTimeout(chatTimer);
  const st = state;
  games++;
  if (!st.winner) { streak = 0; say("draw"); return; }
  let follow;
  if (st.winner === human) { humanWins++; streak = 0; say("humanWin"); follow = "humanWin2"; }
  else {
    turkWins++; streak++;
    // rub it in, with real numbers from the final position
    say("engineWin", { n: Math.ceil(moves.length / 2), g: R._label(human) });
    follow = "engineWin2";
  }
  const g = gameId;
  clearTimeout(winTimer);
  winTimer = setTimeout(() => { if (g === gameId && state.over) say(follow); }, 3500);
}
// after the engine's move; info.score is from the engine's side before it moved
function engineTalk(m, info) {
  if (state.over) { endTalk(); return; }
  if (m === PASS) { say("enginePass"); return; }
  const sc = info.score;
  if (sc >= MATE) {
    const n = Math.ceil((WIN - sc) / 2) - 1; // engine moves still needed after this one
    say(mateSaid ? "mateCount" : "mate", { n }); mateSaid = true; prevP = 1; return;
  }
  if (sc <= -MATE) { if (!doomSaid) { doomSaid = true; say("doomed"); } prevP = 0; return; }
  const p = 1 / (1 + Math.exp(-sc / 300));
  const swing = prevP === null ? 0 : p - prevP; // how much the human's last move changed my winning chances
  if (swing > 0.15 && p > 0.6) say("blunder", { d: Math.round(swing * 100) });
  else if (swing <= -0.1 && Math.random() < 0.7) say("goodMove");
  else if (m & 4096) say("engineCap");
  else if (!engineNearSaid && R._label(3 - human) === 2) { engineNearSaid = true; say("engineNear"); }
  else if (p > 0.85 && !leadSaid) { leadSaid = true; say("winning", { p: Math.round(p * 100) }); }
  else {
    const r = Math.random();
    if (info.depth >= 3 && r < 0.25) say("normal", { depth: info.depth, nodes: man(info.nodes) });
    else if (r < 0.42) chat();
  }
  prevP = p;
}
function humanTalk(m, elapsed) {
  clearTimeout(slowTimer); clearTimeout(chatTimer);
  if (state.over) { endTalk(); return; }
  if (m === PASS) say("humanPass");
  else if (m & 4096) say("humanCap");
  else if (!humanNearSaid && R._label(human) === 2) { humanNearSaid = true; say("humanNear"); }
  else if (elapsed < 1500 && Math.random() < 0.3) say("fast");
  else if (!longSaid && moves.length >= 60) { longSaid = true; say("longGame"); }
}
function armSlowTimer() {
  clearTimeout(slowTimer); clearTimeout(chatTimer);
  turnStart = Date.now();
  const ply = moves.length, g = gameId;
  const still = () => g === gameId && moves.length === ply && started && !state.over && state.stm === human;
  chatTimer = setTimeout(() => { if (still() && Math.random() < 0.6) chat(); }, 15000);
  slowTimer = setTimeout(() => { if (still()) say("slow"); }, 40000);
}

/* ---------------- engine in a background worker ---------------- */
const WORKER_SRC = LoaEngine.toString() + `
const E = LoaEngine({ ttBits: 20 });
E.setWeights(${JSON.stringify(TUNED_WEIGHTS)});
onmessage = function (e) {
  const d = e.data;
  E.setStart();
  for (const m of d.moves) E.play(m);
  postMessage({ id: d.id, info: E.think({ time: d.time, keepHistory: true }) });
};`;
let worker = null, workerBroken = false, busy = null, reqId = 0, localE = null;
function getWorker() {
  if (worker || workerBroken) return worker;
  try {
    worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" })));
    worker.onmessage = (e) => done(e.data);
    worker.onerror = () => { worker = null; workerBroken = true; if (busy) runLocal(busy); };
  } catch (e) { worker = null; workerBroken = true; }
  return worker;
}
function send(req) {
  busy = req;
  req.t0 = Date.now();
  const w = getWorker();
  if (w) w.postMessage({ id: req.id, moves: req.moves, time: req.time });
  else runLocal(req);
}
function runLocal(req) { // no worker available: think on the page itself (the page pauses meanwhile)
  if (!localE) { localE = LoaEngine({ ttBits: 18 }); localE.setWeights(TUNED_WEIGHTS); }
  setTimeout(() => {
    localE.setStart(); for (const m of req.moves) localE.play(m);
    const info = localE.think({ time: req.time, keepHistory: true });
    done({ id: req.id, info });
  }, 30);
}
function done(d) {
  if (!busy || d.id !== busy.id) return;
  const req = busy; busy = null;
  if (req.game === gameId && !req.ponder && !state.over && state.stm !== human) {
    let m = d.info.move;
    if (m !== PASS && !state.legal.includes(m)) m = state.legal[0];
    commit(m, d.info);
    return;
  }
  next();
}

/* ---------------- flow ---------------- */
function next() {
  if (!started || busy || state.over) return;            // a ponder slice calls next() again when it ends
  if (!state.legal.length) { commit(PASS); return; }     // no legal move: pass
  if (state.stm !== human) send({ id: ++reqId, game: gameId, moves: moves.slice(), time: THINK_MS, ponder: false });
  else if (!workerBroken) send({ id: ++reqId, game: gameId, moves: moves.slice(), time: PONDER_MS, ponder: true });
  render();
}
function commit(m, info) {
  const mover = state.stm;
  moves.push(m); sel = -1;
  state = replay();
  render(m === PASS ? -1 : m & 63, m === PASS ? -1 : (m >> 6) & 63);
  if (mover === human) humanTalk(m, Date.now() - turnStart); else engineTalk(m, info);
  if (started && !state.over && state.stm === human) armSlowTimer();
  next();
}
// "새 게임": stop, reset the board, and ask for a side again
function newGame() {
  gameId++;
  clearTimeout(slowTimer); clearTimeout(chatTimer); clearTimeout(winTimer);
  if (busy && !busy.ponder && worker) { worker.terminate(); worker = null; busy = null; } // don't wait out a 5 s think
  started = false; moves = []; sel = -1;
  state = replay();
  say("pick");
  document.getElementById("pick").hidden = false;
  document.getElementById("btn-new").hidden = true;
  document.getElementById("stage").classList.remove("playing");
  render();
  document.getElementById("pick-1").focus();
}
function start(side) {
  gameId++;
  clearTimeout(winTimer);
  human = side; started = true; moves = []; sel = -1;
  prevP = null; mateSaid = leadSaid = doomSaid = humanNearSaid = engineNearSaid = longSaid = false;
  state = replay();
  document.getElementById("pick").hidden = true;
  document.getElementById("btn-new").hidden = false;
  document.getElementById("stage").classList.add("playing");
  boardEl.setAttribute("aria-label", "LOA 판, 나는 " + sideName(side));
  if (games > 0 && streak >= 2 && Math.random() < 0.7) say("streak", { k: streak });
  else if (games > 0 && Math.random() < 0.6) say("rematch", { w: turkWins, l: humanWins });
  else say(side === 1 ? "startHumanBlack" : "startEngineBlack");
  render();
  if (side === 1) armSlowTimer();
  next();
}
function onSquare(s) {
  if (!started || state.over || state.stm !== human) return;
  if (sel >= 0) {
    const m = state.legal.find((x) => (x & 63) === sel && ((x >> 6) & 63) === s);
    if (m !== undefined) { commit(m); return; }
    sel = state.b[s] === human && state.legal.some((x) => (x & 63) === s) ? s : -1;
    render(); return;
  }
  if (state.b[s] === human && state.legal.some((x) => (x & 63) === s)) { sel = s; render(); }
}

/* ---------------- drawing ---------------- */
const boardEl = document.getElementById("board"), sqEls = [];
for (let s = 0; s < 64; s++) {
  const el = document.createElement("button");
  el.type = "button";
  el.className = "sq" + (((s >> 3) + (s & 7)) % 2 ? " dk" : "");
  el.id = "sq-" + sqName(s);
  el.addEventListener("click", () => onSquare(s));
  boardEl.appendChild(el); sqEls.push(el);
}
// the grid, drawn by hand: every line bends a little and the frame overshoots its corners
(function drawGrid() {
  const j = (k) => (Math.random() - 0.5) * k;
  const line = (x1, y1, x2, y2, k) => `M${x1 + j(k)} ${y1 + j(k)} Q${(x1 + x2) / 2 + j(k * 2)} ${(y1 + y2) / 2 + j(k * 2)} ${x2 + j(k)} ${y2 + j(k)}`;
  let inner = "", frame = "";
  for (let i = 1; i < 8; i++) { inner += line(i * 100, 0, i * 100, 800, 4) + line(0, i * 100, 800, i * 100, 4); }
  frame = line(-6, 0, 806, 0, 5) + line(800, -6, 800, 806, 5) + line(806, 800, -6, 800, 5) + line(0, 806, 0, -6, 5);
  boardEl.insertAdjacentHTML("beforeend", `<svg class="grid" viewBox="0 0 800 800" preserveAspectRatio="none" aria-hidden="true">
    <path d="${inner}" fill="none" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <path d="${frame}" fill="none" stroke="#1b1b1b" stroke-width="2.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`);
})();
function statusText(st) {
  const chip = (p) => `<span class="chip ${p === 1 ? "b" : "w"}"></span>`;
  if (!started) return "";
  if (st.over) {
    if (!st.winner) return `무승부`;
    return `${chip(st.winner)}${st.winner === human ? "내가 이겼다" : char.short + "가 이겼다"}`;
  }
  if (st.stm === human) return `${chip(human)}내 차례 (${sideName(human)})`;
  return `${chip(3 - human)}${char.short} 차례`;
}
function render(animFrom, animTo) {
  const st = state;
  const targets = new Map();
  if (sel >= 0) for (const m of st.legal) if ((m & 63) === sel) targets.set((m >> 6) & 63, (m & 4096) !== 0);
  const real = st.last >= 0 && st.last !== PASS;
  const lf = real ? st.last & 63 : -1, lt = real ? (st.last >> 6) & 63 : -1;
  for (let s = 0; s < 64; s++) {
    const el = sqEls[s], p = st.b[s];
    el.classList.toggle("last", s === lf || s === lt);
    el.classList.toggle("sel", s === sel);
    el.classList.toggle("won", st.won.includes(s));
    let h = p ? `<span class="piece ${p === 1 ? "b" : "w"}"></span>` : "";
    if (targets.has(s)) h += targets.get(s) ? `<span class="ring"></span>` : `<span class="dot"></span>`;
    if (el.dataset.h !== h) { el.innerHTML = h; el.dataset.h = h; }
    el.setAttribute("aria-label", sqName(s) + (p ? (p === 1 ? " 흑" : " 백") : " 빈칸") + (targets.has(s) ? ", 여기로 이동 가능" : ""));
  }
  const thinking = started && !st.over && st.stm !== human;
  portraitEl.classList.toggle("thinking", thinking);
  boardEl.classList.toggle("drawn", st.over && !st.winner);
  const sh = statusText(st), se = document.getElementById("status");
  if (se.dataset.h !== sh) { se.innerHTML = sh; se.dataset.h = sh; }
  if (animFrom >= 0 && animTo >= 0 && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const pc = sqEls[animTo].querySelector(".piece");
    if (pc) {
      const a = sqEls[animFrom].getBoundingClientRect(), b = sqEls[animTo].getBoundingClientRect();
      pc.style.transform = `translate(${a.left - b.left}px, ${a.top - b.top}px)`;
      pc.getBoundingClientRect();
      pc.classList.add("moving");
      pc.style.transform = "";
    }
  }
}

document.getElementById("btn-new").addEventListener("click", newGame);
document.getElementById("pick-1").addEventListener("click", () => start(1));
document.getElementById("pick-2").addEventListener("click", () => start(2));
portraitEl.innerHTML = char.svg;
place(blobX);
wanderTimer = setTimeout(wander, 2000);
say("pick");
state = replay();
render();
</script>
